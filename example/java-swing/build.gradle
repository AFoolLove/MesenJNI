plugins {
	id 'java'
}

group = 'me.afoolslove'
version = '1.0-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	// The samples use the JNI-backed API, which lives in the sibling `Java`
	// project. Two ways to consume it:
	//   * build a jar there (`gradle jar` in Java/) and point at it, or
	//   * add both projects to one Gradle build (includeBuild / composite).
	// Left commented because neither location is fixed yet.
	// implementation files('../../Java/build/libs/Java-1.0-SNAPSHOT.jar')

	testImplementation platform('org.junit:junit-bom:5.10.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}
