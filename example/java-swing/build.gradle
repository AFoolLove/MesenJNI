plugins {
	id 'java'
}

group = 'me.afoolslove'
version = '1.0-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

repositories {
	mavenCentral()
}

dependencies {
	// The samples use the JNI-backed API, which lives in the sibling `Java`
	// project. Build its jar first (`gradle jar` in Java/) so this path exists;
	// a composite build (includeBuild) would avoid the ordering requirement.
	implementation files('../../Java/build/libs/Java-1.0-SNAPSHOT.jar')
}
