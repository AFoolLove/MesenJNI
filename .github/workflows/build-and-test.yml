name: Build and test

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '*'

jobs:
  windows:
    name: Windows x64 (core + JNI + tests)
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build core + JNI bindings
        run: cmake --build build --config Release

      # Gson is only needed by mesen.MesenSettings; it comes from Maven Central
      # rather than a committed jar. Drop it under build/ so it stays untracked.
      - name: Fetch Gson
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/deps | Out-Null
          Invoke-WebRequest -Uri 'https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10/gson-2.10.jar' `
            -OutFile 'build/deps/gson-2.10.jar'

      # The Java side is a Gradle project in Java/; CI compiles it with javac into
      # one flat output directory to avoid depending on the wrapper, and includes
      # the Swing samples so they are checked for compilation too.
      - name: Compile Java
        shell: pwsh
        run: |
          javac -encoding UTF-8 -cp 'build/deps/gson-2.10.jar' -d build/classes `
            Java/src/main/java/mesen/*.java `
            Java/src/main/java/mesen/interfaces/*.java `
            Java/src/main/java/mesen/debugger/*.java `
            Java/src/test/java/*.java `
            example/java-swing/src/main/java/*.java

      # The tests are plain main() classes. Tests that need a ROM skip themselves
      # when it is absent (the repository does not ship ROMs), so the suite passes
      # on a fresh checkout.
      - name: Run tests
        shell: pwsh
        run: |
          $tests = @(
            'SmokeTest', 'CallbackSmokeTest', 'ConfigSmokeTest', 'ConfigFileSmokeTest',
            'AudioSmokeTest', 'ToneSmokeTest', 'LuaSmokeTest', 'ImplSmokeTest',
            'DebugSmokeTest', 'ReinitTest', 'RecordSmokeTest', 'MiscSmokeTest',
            'HistorySmokeTest', 'TestApiSmokeTest', 'NetplaySmokeTest',
            'RomBytesSmokeTest', 'ConsoleSmokeTest', 'ApiCoverageTest',
            'CoreRateTest', 'FrameVerifyTest', 'InputVerifyTest'
          )

          $classpath = "build/classes;build/deps/gson-2.10.jar"
          $libPath = "-Djava.library.path=bin/win-x64/Release"
          $failed = @()

          foreach($t in $tests) {
            Write-Host "::group::$t"
            java $libPath -cp $classpath $t
            if($LASTEXITCODE -ne 0) {
              $failed += $t
            }
            Write-Host "::endgroup::"
          }

          if($failed.Count -gt 0) {
            Write-Host "::error::Failed tests: $($failed -join ', ')"
            exit 1
          }
          Write-Host "All $($tests.Count) tests passed or skipped."
